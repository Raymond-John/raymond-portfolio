<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/admin.css?v=gold7" />
  </head>
  <body class="admin-body" data-admin="settings">
    <div class="admin-app">
    <div class="admin-shell">
      <aside id="admin-sidebar"></aside>
      <div id="admin-backdrop"></div>
      <div class="main">
        <header class="topbar">
          <div class="topbar__left">
            <button class="menu-btn" id="admin-menu-btn" type="button" aria-label="Open menu">☰</button>
            <div>
              <h1>Website settings</h1>
              <p>Site identity and public contact labels</p>
            </div>
          </div>
        </header>
        <div class="content">
          <form class="panel" id="settings-form">
            <div class="panel__head">
              <div><h2>General</h2><p>These values feed the public site copy and contact channels</p></div>
              <button class="btn btn-primary" type="submit">Save settings</button>
            </div>
            <div class="field"><label for="siteTitle">Site title</label><input id="siteTitle" name="siteTitle" /></div>
            <div class="field"><label for="siteDescription">Site description</label><textarea id="siteDescription" name="siteDescription"></textarea></div>
            <div class="field"><label for="accentColor">Accent color</label><input id="accentColor" name="accentColor" /></div>
            <div class="field-row">
              <div class="field"><label for="email">Public email</label><input id="email" name="email" /></div>
              <div class="field"><label for="whatsapp">WhatsApp label</label><input id="whatsapp" name="whatsapp" /></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="github">GitHub label</label><input id="github" name="github" /></div>
              <div class="field"><label for="linkedin">LinkedIn label</label><input id="linkedin" name="linkedin" /></div>
            </div>
          </form>
          <div class="panel">
            <div class="panel__head">
              <div>
                <h2>Danger zone</h2>
                <p>Reset restores the original seeded demo content in this browser</p>
              </div>
              <button class="btn btn-danger" type="button" id="reset-data">Reset demo data</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
    <script src="../js/data.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
