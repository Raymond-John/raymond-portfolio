<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/admin.css?v=signal12" />
  </head>
  <body class="admin-body" data-admin="projects">
    <div class="admin-app">
      <div class="admin-shell">
        <aside id="admin-sidebar"></aside>
        <div id="admin-backdrop"></div>
        <div class="main">
          <header class="topbar">
            <div class="topbar__left">
              <button class="menu-btn" id="admin-menu-btn" type="button" aria-label="Open menu">☰</button>
              <div>
                <h1>Projects</h1>
                <p>Library table — edit, publish, feature and delete</p>
              </div>
            </div>
            <div class="topbar__actions">
              <a class="btn btn-ghost" href="../projects.html" target="_blank" rel="noopener">Preview</a>
              <a class="btn btn-primary" href="project-form.html">Add project</a>
            </div>
          </header>
          <div class="content">
            <div class="panel panel--flush">
              <div class="panel__head">
                <div>
                  <h2>Portfolio library</h2>
                  <p>Published items sync to the public Projects page. Featured items can appear on Home.</p>
                </div>
              </div>
              <div id="projects-root"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/data.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
